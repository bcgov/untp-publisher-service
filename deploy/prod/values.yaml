## Production overlay — not yet validated against the untp-publisher chart.
## Copy/adapt from deploy/dev/values.yaml before installing.

ingress:
  annotations:
    route.openshift.io/termination: edge
  tls:
    - secretName: untp-publisher-tls
      hosts:
        - publisher.orgbook.gov.bc.ca

networkPolicy:
  ingress:
    namespaceSelector:
      network.openshift.io/policy-group: ingress

backend:
  image:
    repository: ghcr.io/bcgov/untp-publisher-service
    tag: v0.0.5
    pullPolicy: Always
  host: publisher.orgbook.gov.bc.ca
  traction:
    apiUrl: "https://traction-tenant-proxy-prod.apps.silver.devops.gov.bc.ca"
  didwebvh:
    serverUrl: "https://registry.digitaltrust.gov.bc.ca"
    witnessPublicKeyMultibase: "z6MkpJybUKKTCjrYPL6B6EWw534ESR3oEC6Bo2XSAefeUG7Y"
  environment:
    orgbookUrl: "https://orgbook.gov.bc.ca"
    issuerRegistryUrl: "https://bcgov.github.io/digital-trust-toolkit/registrations/issuers/prod.json"
  resources:
    limits:
      cpu: 400m
      memory: 1600Mi
    requests:
      cpu: 200m
      memory: 820Mi

mongodb:
  targetPlatform: openshift
  commonLabels:
    backup: "true"
    env: prod
