## Test overlay — namespace f890b1-test.
##   cd charts/untp-publisher && helm dependency update
##   helm upgrade --install untp-publisher-service . -f ../../deploy/test/values.yaml -n f890b1-test
##
## Public URL: vanity domain publisher-test.nrs.gov.bc.ca (edge TLS via custom cert Secret).
## OpenShift edge termination — cert/key come from ingress.tls secretName below.
##
## Pre-create TLS Secret untp-publisher-service-tls (keys: tls.crt, tls.key) via:
##   oc create secret tls untp-publisher-service-tls --cert=<crt> --key=<key> -n f890b1-test
## Do not commit or store the cert/key locally beyond generating them for this command.
##
## Pre-create Traction Secret untp-publisher-service-traction-tenant-info
## (keys: traction_tenant_id, traction_api_key) — see backend.traction.existingSecret.
##
## Image: https://github.com/bcgov/untp-publisher-service/releases/tag/v0.1.0 (Discovery UI).

ingress:
  annotations:
    route.openshift.io/termination: edge
  tls:
    - hosts:
        - untp-publisher-api-test.apps.gold.devops.gov.bc.ca
        - publisher-test.nrs.gov.bc.ca
      secretName: untp-publisher-service-tls

networkPolicy:
  ingress:
    namespaceSelector:
      network.openshift.io/policy-group: ingress

backend:
  testSuite: false
  image:
    repository: ghcr.io/bcgov/untp-publisher-service
    tag: v0.1.0
    pullPolicy: Always
  # Hostname only (sets Ingress rule + pod PUBLISHER_DOMAIN).
  # Public origin: https://untp-publisher-api-test.apps.gold.devops.gov.bc.ca
  host: untp-publisher-api-test.apps.gold.devops.gov.bc.ca
  # Vanity domain (also in ingress.tls.hosts); certs come from untp-publisher-service-tls Secret.
  additionalHosts:
    - publisher-test.nrs.gov.bc.ca
  traction:
    apiUrl: "https://traction-tenant-proxy-test.apps.silver.devops.gov.bc.ca"
    existingSecret: untp-publisher-service-traction-tenant-info
  environment:
    webvhServerUrl: "https://registry-test.digitaltrust.gov.bc.ca"
    # Witness multikey from former orgbook-publisher test chart → did:key.
    publisherWitnessId: "did:key:z6MkpiDTaJuPzFZpg8MCYRM4ff7i6hNMQaL7fUP5pHBFo75c"
    projectTitle: "BC NRS Publisher"
    projectVersion: "v0"
    landingTagline: "Verifiable critical raw material provenance for British Columbia's Natural Resource Sector."
    landingDescription: "Browse UNTP-aligned credentials that attest critical raw material provenance across the Natural Resource Sector."
    landingLogoUrl: "/static/admin/images/bcgov-logo.svg"
    landingPrimaryColor: "#013366"
    landingSecondaryColor: "#FCBA19"
  resources:
    limits:
      cpu: 300m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 256Mi

mongodb:
  customUser:
    # Must match Helm release name untp-publisher-service (parent-managed secret).
    existingSecret: untp-publisher-service-mongodb-custom-user-secret
  targetPlatform: openshift
  # Namespace storage quota is 1Gi; MongoDB 8 needs ~500Mi free → use full 1Gi.
  persistence:
    storageClass: netapp-block-standard
    size: 1Gi
  # 512Mi limit previously OOMKilled under mongosh probes; 768Mi + cache cap is stable
  # without raising request quota (still 256Mi request).
  resources:
    limits:
      memory: 768Mi
    requests:
      cpu: 25m
      memory: 256Mi
  config:
    content: |
      systemLog:
        quiet: true
        verbosity: 0
      net:
        bindIpAll: true
      storage:
        wiredTiger:
          engineConfig:
            cacheSizeGB: 0.25
  livenessProbe:
    initialDelaySeconds: 45
    periodSeconds: 30
  readinessProbe:
    initialDelaySeconds: 10
    periodSeconds: 30
  commonLabels:
    backup: "true"
    env: test
