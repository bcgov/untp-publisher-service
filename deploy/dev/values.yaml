## Development overlay — namespace f890b1-dev.
##   cd charts/untp-publisher && helm dependency update
##   helm upgrade --install untp-publisher-service . -f ../../deploy/dev/values.yaml -n f890b1-dev
##
## Public URL: standard Gold Route host (*.apps.gold.devops.gov.bc.ca; same edge-TLS pattern as BC-Wallet-Demo on Silver).
## OpenShift edge termination — no ingress.tls / no custom cert Secret.
##
## Pre-create Traction Secret untp-publisher-service-traction-tenant-info
## (keys: traction_tenant_id, traction_api_key) — see backend.traction.existingSecret.

ingress:
  annotations:
    route.openshift.io/termination: edge
  # No tls: — router terminates HTTPS (see BC-Wallet-Demo deploy/showcase/values-dev.yaml).

networkPolicy:
  ingress:
    namespaceSelector:
      network.openshift.io/policy-group: ingress

backend:
  testSuite: false
  image:
    repository: ghcr.io/bcgov/untp-publisher-service
    tag: dev-0.0.3
    pullPolicy: Always
  # Hostname only (sets Ingress rule + pod PUBLISHER_DOMAIN).
  # Public origin: https://untp-publisher-api-dev.apps.gold.devops.gov.bc.ca
  host: untp-publisher-api-dev.apps.gold.devops.gov.bc.ca
  traction:
    apiUrl: "https://traction-tenant-proxy-dev.apps.silver.devops.gov.bc.ca"
    existingSecret: untp-publisher-service-traction-tenant-info
  environment:
    webvhServerUrl: "https://registry-dev.digitaltrust.gov.bc.ca"
    # Same witness as backend/tests/test_did_key.py (multikey → did:key).
    publisherWitnessId: "did:key:z6MkekByGjKYvP6dpMBJEHt5UN72rKPVoDgzcS9Hoq6bjfr1"
  resources:
    limits:
      cpu: 300m
      memory: 384Mi
    requests:
      cpu: 25m
      memory: 128Mi

mongodb:
  customUser:
    # Must match Helm release name untp-publisher-service (parent-managed secret).
    existingSecret: untp-publisher-service-mongodb-custom-user-secret
  targetPlatform: openshift
  # MongoDB 8 needs ~500Mi free disk; a 512Mi volume fails once journal/FTDC grow.
  # 1Gi on netapp-block-standard (namespace also has 1Gi netapp-file-standard).
  persistence:
    storageClass: netapp-block-standard
    size: 1Gi
  resources:
    limits:
      memory: 384Mi
    requests:
      cpu: 25m
      memory: 128Mi
  commonLabels:
    backup: "true"
    env: dev
