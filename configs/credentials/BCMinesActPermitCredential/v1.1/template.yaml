# Verifiable credential template — BCMinesActPermitCredential v1.1 (UNTP 0.7.0 DCC).
# Rendered with Jinja at publish, then parsed as YAML.
# Context: data, organization, template, version
# At issue time the publisher also appends {PUBLISHER_DOMAIN}/contexts/publisher/v1
# so SimpleRefreshQuery and OCABundle terms resolve.

{% set permitNumber = data.permit.identifier -%}
{% set permitUrn = "urn:ca:bcgov:mines-act:permit:" ~ permitNumber -%}
{# OCA indexes /0/ for criterion, regulation, facility; commodities may have N items. #}
{% if data.mine is not mapping %}{{ fail('data.mine must be an object') }}{% endif -%}
{% set assessedFacility = data.mine -%}
{% set facilityId = assessedFacility.identifier | default(assessedFacility.registeredId | default(''), true) -%}
{% set assessedProduct = data.commodities | default([]) -%}
{% set assessedOrganisation = organization -%}
{% set issuedToParty = organization -%}
{% set assessmentDate = data.permit.issuanceDate -%}

context: 
  - https://www.w3.org/ns/credentials/v2
  - https://vocabulary.uncefact.org/untp/0.7.0/context/

type: 
  - VerifiableCredential
  - DigitalConformityCredential

name: Mines Act Permit
description: >-
  A digital conformity credential attesting to a Mines Act permit issued under the
  Mines Act (British Columbia). Each credential contains one conformity assessment
  that represents the permit.

credentialSubject:
  type:
    - ConformityAttestation
  id: {{ permitUrn | tojson }}
  name: "Mines Act Permit {{ permitNumber }} — {{ issuedToParty.name }}"
  description: >-
    Mines Act permit issued to {{ issuedToParty.name }} for {{ assessedFacility.name }} (permit {{ permitNumber }}).

  issuedToParty:
    type:
      - Party
    id: {{ (permitUrn ~ ':permittee:' ~ (issuedToParty.registeredId | default(''))) | tojson }}
    name: {{ issuedToParty.name | tojson }}
    registeredId: {{ issuedToParty.registeredId | tojson }}
    idScheme:
      type:
        - IdentifierScheme
      id: https://www.bcregistry.gov.bc.ca/
      name: BC Registry

  assessorLevel: unspecified
  assessmentLevel: authority-mandate
  attestationType: certification

  referenceScheme:
    id: https://www.bclaws.gov.bc.ca/civix/document/id/complete/statreg/96293_01
    name: Mines Act (British Columbia)

  referenceProfile:
    id: https://bcgov.github.io/digital-trust-toolkit/docs/governance/mining/bc-mines-act-permit/1.1.1/governance
    name: BC Mines Act Permit Governance

  conformityAssessment:
    - type:
        - ConformityAssessment
      id: {{ (permitUrn ~ ':assessment') | tojson }}

      registeredId: {{ permitNumber | tojson }}
      idScheme:
        type:
          - IdentifierScheme
        id: https://mines.nrs.gov.bc.ca/
        name: BC Mines NRS

      assessmentDate: {{ assessmentDate | tojson }}
      name: Mines Act Permit {{ permitNumber }} — {{ assessedFacility.name }}
      description: >-
        This conformity assessment is the Mines Act permit. Permit {{ permitNumber }} authorizes operations at {{ assessedFacility.name }}{% if assessedProduct %} for {{ assessedProduct | map(attribute='name') | join(', ') }}{% else %} for the stated product scope{% endif %} under the Mines Act.

      assessmentCriteria:
        - id: https://www.bclaws.gov.bc.ca/civix/document/id/complete/statreg/96293_01#section10
          name: Permits
          conformityTopic:
            id: https://vocabulary.uncefact.org/conformity-topic/governance-compliance
            name: Governance.Compliance

      referenceRegulation:
        - id: https://www2.gov.bc.ca/gov/content/industry/mineral-exploration-mining/health-safety/health-safety-and-reclamation-code-for-mines-in-british-columbia
          name: Health, Safety and Reclamation Code for Mines in British Columbia

      assessedPerformance:
        - metric:
            id: https://mines.nrs.gov.bc.ca/authorizations#minesActPermits
            name: Permit issued
          measure:
            value: 1
            unit: C62

      assessedFacility:
        - type:
            - FacilityVerification
          idVerifiedByCAB: {{ (assessedFacility.IDverifiedByCAB | default(true)) | tojson }}
          facility:
            type:
              - Facility
            id: {{ (permitUrn ~ ':mine:' ~ facilityId) | tojson }}
            name: {{ (assessedFacility.name | default('')) | tojson }}
            registeredId: {{ facilityId | tojson }}
            idScheme:
              type:
                - IdentifierScheme
              id: https://mines.nrs.gov.bc.ca/
              name: British Columbia Mine Information
            {% if 'locationInformation' in assessedFacility or 'geoLocation' in assessedFacility %}
            locationInformation:
              {% if 'locationInformation' in assessedFacility %}
              plusCode: {{ assessedFacility.locationInformation | tojson }}
              {% endif %}
              {% if 'geoLocation' in assessedFacility %}
              geoLocation:
                latitude: {{ assessedFacility.geoLocation.latitude | tojson }}
                longitude: {{ assessedFacility.geoLocation.longitude | tojson }}
              {% endif %}
            {% endif %}

      assessedOrganisation:
        type:
          - Party
        id: {{ (permitUrn ~ ':permittee:' ~ (assessedOrganisation.registeredId | default(''))) | tojson }}
        name: {{ assessedOrganisation.name | tojson }}
        registeredId: {{ assessedOrganisation.registeredId | tojson }}
        idScheme:
          type:
            - IdentifierScheme
          id: https://www.bcregistry.gov.bc.ca/
          name: BC Registry

      {% if assessedProduct -%}
      assessedProduct:
        {%- for item in assessedProduct %}
        {%- set product_name = item.name | default('Product ' ~ loop.index, true) %}
        {%- set product_key = item.identifier | default(item.registeredId | default(product_name | product_slug, true), true) %}
        - type:
            - ProductVerification
          product:
            type:
              - Product
            id: {{ (permitUrn ~ ':commodity:' ~ product_key) | tojson }}
            name: {{ product_name | tojson }}
          idVerifiedByCAB: {{ (item.IDverifiedByCAB | default(false)) | tojson }}
        {%- endfor %}
      {%- endif %}

      {% set infoPageId = assessedFacility.get('infoPageId') | default('', true) -%}
      {% if infoPageId -%}
      evidence:
        - type:
            - Link
          linkName: Mines Act authorizations
          linkURL: {{ ('https://mines.nrs.gov.bc.ca/mine/' ~ infoPageId ~ '/authorizations#authorization-MEM') | tojson }}
          mediaType: text/html
      {%- endif %}

      conformityTopic:
        id: https://vocabulary.uncefact.org/conformity-topic/governance-compliance
        name: Governance.Compliance

      conformance: true
