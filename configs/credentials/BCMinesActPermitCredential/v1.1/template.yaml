# Verifiable credential template — BCMinesActPermitCredential v1.1 (UNTP 0.7.0 DCC).
# Rendered with Jinja at publish, then parsed as YAML.
# Context: publish request ``data`` keys at top level (permit, permittee, mine, commodities).
# TODO/BUG: publisher currently omits renderMethod (+ render-method @context)
# until UNTP ConformityCredential schema aligns with TemplateRenderMethod.

{% set permitNumber = permit.identifier | required -%}

{% set attestation = namespace(
  id="urn:ca:bcgov:mines-act:permit:" ~ (permitNumber | required)
) -%}

{% set assessment = namespace(
  id=attestation.id ~ ":assessment",
  date=permit.issuanceDate | isodate,
  registeredId=permitNumber | required
) -%}

{% set issuedToParty = namespace(
  id=attestation.id ~ ":permittee:" ~ (permittee.identifier | required),
  name=permittee.name | required,
  registeredId=permittee.identifier | required
) -%}

{% set assessedOrganisation = namespace(
  id=attestation.id ~ ":permittee:" ~ (permittee.identifier | required),
  name=permittee.name | required,
  registeredId=permittee.identifier | required
) -%}

{% set assessedFacility = namespace(
  id=attestation.id ~ ":mine:" ~ (mine.identifier | required),
  name=mine.name | required,
  registeredId=mine.identifier | required,
  locationInformation=mine.locationInformation | default,
  geoLocation=mine.geoLocation | default,
  infoPageId=mine.infoPageId | default,
  IDverifiedByCAB=mine.IDverifiedByCAB | default(true)
) -%}

{% set assessedProduct = [] -%}
{% for commodity in commodities | default([], true) -%}
  {% set _ = assessedProduct.append(namespace(
    id=attestation.id ~ ":commodity:" ~ (commodity.name | required | toslug),
    name=commodity.name | required,
    IDverifiedByCAB=commodity.IDverifiedByCAB | default(false)
  )) -%}
{% endfor -%}

context: 
  - https://www.w3.org/ns/credentials/v2
  - https://vocabulary.uncefact.org/untp/0.7.0/context/

type: 
  - VerifiableCredential
  - DigitalConformityCredential

name: Mines Act Permit
description: >-
  A digital conformity credential attesting to a Mines Act permit issued under the
  Mines Act (British Columbia). Each credential contains one conformity assessment
  that represents the permit.

credentialSubject:
  type:
    - ConformityAttestation
  id: {{ attestation.id | tojson }}
  name: "Mines Act Permit {{ permitNumber }}"
  description: >-
    Mines Act permit issued to {{ issuedToParty.name }} for {{ assessedFacility.name }}.

  issuedToParty:
    type:
      - Party
    id: {{ issuedToParty.id | tojson }}
    name: {{ issuedToParty.name | tojson }}
    registeredId: {{ issuedToParty.registeredId | tojson }}
    idScheme:
      type:
        - IdentifierScheme
      id: https://www.bcregistry.gov.bc.ca/
      name: BC Registry

  assessorLevel: unspecified
  assessmentLevel: authority-mandate
  attestationType: certification

  referenceScheme:
    id: https://www.bclaws.gov.bc.ca/civix/document/id/complete/statreg/96293_01
    name: Mines Act (British Columbia)

  referenceProfile:
    id: https://developer.gov.bc.ca/docs/default/component/digital-trust/governance/mining/bc-mines-act-permit/governance-json-ld/
    name: BC Mines Act Permit Governance

  # Image sourced from trustmark.png in this credential version directory.
  trustmark:
    name: Verified Mine Permit
    description: >-
      Trust mark for a verified Mines Act permit issued under the BC Mines Act.
    imageData: 
    mediaType: image/png

  conformityAssessment:
    - type:
        - ConformityAssessment
      id: {{ assessment.id | tojson }}

      registeredId: {{ assessment.registeredId | tojson }}
      idScheme:
        type:
          - IdentifierScheme
        id: https://mines.nrs.gov.bc.ca/
        name: BC Mines NRS

      assessmentDate: {{ assessment.date | tojson }}
      name: Mines Act Permit {{ permitNumber }}
      description: >-
        Permit {{ permitNumber }} authorizes operations at {{ assessedFacility.name }}{% if assessedProduct %} for {{ assessedProduct | map(attribute='name') | join(', ') }}{% else %} for the stated product scope{% endif %} under the Mines Act.

      assessmentCriteria:
        - type:
            - Criterion
          id: https://www.bclaws.gov.bc.ca/civix/document/id/complete/statreg/96293_01#section10
          name: Permits
          conformityTopic:
            type:
              - ConformityTopic
            id: https://vocabulary.uncefact.org/conformity-topic/governance-compliance
            name: Governance.Compliance

      referenceRegulation:
        - id: https://www2.gov.bc.ca/gov/content/industry/mineral-exploration-mining/health-safety/health-safety-and-reclamation-code-for-mines-in-british-columbia
          name: Health, Safety and Reclamation Code for Mines in British Columbia

      assessedPerformance:
        - metric:
            id: https://mines.nrs.gov.bc.ca/authorizations#minesActPermits
            name: Permit issued
          measure:
            value: 1
            unit: C62

      assessedFacility:
        - idVerifiedByCAB: {{ assessedFacility.IDverifiedByCAB | tojson }}
          facility:
            type:
              - Facility
            id: {{ assessedFacility.id | tojson }}
            name: {{ assessedFacility.name | tojson }}
            registeredId: {{ assessedFacility.registeredId | tojson }}
            idScheme:
              type:
                - IdentifierScheme
              id: https://mines.nrs.gov.bc.ca/
              name: British Columbia Mine Information
            {% if assessedFacility.locationInformation or assessedFacility.geoLocation %}
            locationInformation:
              {% if assessedFacility.locationInformation %}
              plusCode: {{ assessedFacility.locationInformation | tojson }}
              {% endif %}
              {% if assessedFacility.geoLocation %}
              geoLocation:
                latitude: {{ assessedFacility.geoLocation.latitude | tojson }}
                longitude: {{ assessedFacility.geoLocation.longitude | tojson }}
              {% endif %}
            {% endif %}

      assessedOrganisation:
        type:
          - Party
        id: {{ assessedOrganisation.id | tojson }}
        name: {{ assessedOrganisation.name | tojson }}
        registeredId: {{ assessedOrganisation.registeredId | tojson }}
        idScheme:
          type:
            - IdentifierScheme
          id: https://www.bcregistry.gov.bc.ca/
          name: BC Registry

      {% if assessedProduct -%}
      assessedProduct:
        {%- for item in assessedProduct %}
        - product:
            type:
              - Product
            id: {{ item.id | tojson }}
            name: {{ item.name | tojson }}
          idVerifiedByCAB: {{ item.IDverifiedByCAB | tojson }}
        {%- endfor %}
      {%- endif %}

      {% if assessedFacility.infoPageId -%}
      evidence:
        - type:
            - Link
          linkName: Mines Act authorizations
          linkURL: {{ ('https://mines.nrs.gov.bc.ca/mine/' ~ assessedFacility.infoPageId ~ '/authorizations#authorization-MEM') | tojson }}
          mediaType: text/html
      {%- endif %}

      conformityTopic:
        - type:
            - ConformityTopic
          id: https://vocabulary.uncefact.org/conformity-topic/governance-compliance
          name: Governance.Compliance

      conformance: true
