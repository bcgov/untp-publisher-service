# Issuer registry.
# id: namespace:alias — full DID is did:web:{PUBLISHER_DOMAIN}:{id}
# Optional verificationMethod: Ed25519 multikey on the DID document / Traction wallet.
# Per-credential assets: configs/credentials/{type}/{version}/
#   template.yaml  — Jinja VC template
#   oca.json       — OCA bundle
#   payload.json   — sample publication API request
#   sample.json    — sample issued credential

instances:
  - id: mines-act:chief-permitting-officer
    name: Chief Permitting Officer
    description: The Chief Permitting Officer is responsible for issuing Mines Act permits.
    credentials:
      - type: BCMinesActPermitCredential
        version: v1.1
