# Verifiable credential template — BCMinesActPermitCredential v1.0 (UNTP 0.7.0 DCC).
# Jinja2 context at publish: publication payload (`credential`, `options`) + `entity` (OrgBook).

type: BCMinesActPermitCredential
version: v1.1

name: Mines Act Permit

credentialSubject:
  name: "Mines Act Permit {{ options.cardinalityId }} — {{ entity.name }}"
  description: >-
    Mines Act permit issued to {{ entity.name }} (permit {{ options.cardinalityId }}).
    {%- set facilities = options.additionalData.assessedFacility | default([]) -%}
    {% if facilities -%}
    {{ facilities | map(attribute='name') | join(', ') }}.
    {%- else -%}
    No facilities assessed.
    {%- endif %}
    One conformity assessment represents this permit.

  assessorLevel: unspecified
  assessmentLevel: authority-mandate
  attestationType: certification

  referenceScheme:
    id: https://www.bclaws.gov.bc.ca/civix/document/id/complete/statreg/96293_01
    name: Mines Act (British Columbia)

  referenceProfile:
    id: https://bcgov.github.io/digital-trust-toolkit/docs/governance/mining/bc-mines-act-permit/1.1.1/governance
    name: BC Mines Act Permit Governance

  conformityAssessment:
    name: >-
      {%- set facilities = options.additionalData.assessedFacility | default([]) -%}
      Mines Act Permit {{ options.cardinalityId }} —
      {{ facilities[0].name if facilities else 'registered site' }}
    description: >-
      This conformity assessment is the Mines Act permit. This is permit {{ options.cardinalityId }}.
      {%- set products = options.additionalData.assessedProduct | default([]) -%}
      {% if products -%}
      Product scope: {{ products | map(attribute='name') | join(', ') }}.
      {%- endif -%}
      {%- set facilities = options.additionalData.assessedFacility | default([]) -%}
      {% if facilities -%}
      Operations at {{ facilities[0].name }}.
      {%- endif %}

    idScheme:
      id: https://registry.digitaltrust.gov.bc.ca/mines-act/permits
      name: BC Mines Act Permit Register

    assessmentCriteria:
      - conformityTopic:
          id: https://vocabulary.uncefact.org/conformity-topic/governance-compliance
          name: Governance.Compliance

    assessedPerformance:
      - metric:
          id: https://bcgov.github.io/digital-trust-toolkit/docs/governance/mining/bc-mines-act-permit/1.1.1/metrics/permit-issued
          name: Permit issued
        measure:
          value: 1
          unit: C62

    conformityTopic:
      id: https://vocabulary.uncefact.org/conformity-topic/governance-compliance
      name: Governance.Compliance

    conformance: true
