{{- /*
  CloudPirates custom-user-secret uses randAlphaNum when existingSecret is empty; root admin
  secret already uses lookup. Parent chart owns the custom-user secret when existingSecret is
  set to the release-scoped name (see values.yaml / deploy overlays).
*/ -}}
{{- if and .Values.mongodb.enabled .Values.mongodb.customUser.name .Values.mongodb.customUser.existingSecret }}
{{- $secretName := include "backend.databaseSecretName" . }}
{{- if eq .Values.mongodb.customUser.existingSecret $secretName }}
{{- $dbKey := .Values.mongodb.customUser.secretKeys.database }}
{{- $userKey := .Values.mongodb.customUser.secretKeys.name }}
{{- $pwKey := .Values.mongodb.customUser.secretKeys.password }}
{{- $customDb := include "getSecretValue" (dict "Namespace" .Release.Namespace "Kind" "Secret" "Name" $secretName "Key" $dbKey) }}
{{- $customUser := include "getSecretValue" (dict "Namespace" .Release.Namespace "Kind" "Secret" "Name" $secretName "Key" $userKey) }}
{{- $customPassword := include "getSecretValue" (dict "Namespace" .Release.Namespace "Kind" "Secret" "Name" $secretName "Key" $pwKey) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "backend.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ $dbKey }}: {{ $customDb | default (.Values.mongodb.customUser.database | default .Values.mongodb.customUser.name | b64enc) }}
  {{ $userKey }}: {{ $customUser | default (.Values.mongodb.customUser.name | b64enc) }}
  {{ $pwKey }}: {{ $customPassword | default (.Values.mongodb.customUser.password | default (randAlphaNum 32) | b64enc) }}
{{- end }}
{{- end }}
