---
# -- String to partially override the chart name
nameOverride: "untp-publisher-service"
# -- String to fully override the chart name
fullnameOverride: "untp-publisher-service"

ingress:
  # -- Enable the Ingress resource
  enabled: true
  # -- TLS configuration for the ingress
  tls: []
  # -- Additional labels for the ingress resource
  labels: {}
  # -- Annotations for the ingress resource
  annotations: {}

networkPolicy:
  ingress:
    # -- Namespace selector labels for the backend ingress network policy
    namespaceSelector: {}

# -- @default -- See sub-values
backend:
  # -- Backend hostname used for the Ingress rule and PUBLISHER_DOMAIN env var
  host: ""

  # -- Minimal app: only /server/status and POST /test-suite/validate (no publisher API).
  # Skips Traction/Mongo startup provision when true.
  testSuite: false

  # -- DID WebVH registry (witness endorses issuer DID documents)
  didwebvh:
    # -- DID WebVH server base URL. Sets pod env DID_WEB_SERVER_URL.
    serverUrl: ""
    # -- Witness public key (multibase). Sets pod env PUBLISHER_MULTIKEY.
    witnessPublicKeyMultibase: ""

  # -- Traction tenant proxy configuration
  traction:
    # -- Traction tenant proxy base URL (no path). Sets pod env TRACTION_API_URL.
    apiUrl: ""
    # -- Pre-created Secret for tenant credentials. When empty, Helm manages
    # `{backend.fullname}-traction` on install. When set, Helm does not create the Secret.
    existingSecret: ""
    # -- Keys in the Traction Secret
    secretKeys:
      tenantId: traction_tenant_id
      apiKey: traction_api_key

  environment:
    # -- Witness did:key (Ed25519 multikey in method id). Sets pod env PUBLISHER_WITNESS_ID.
    publisherWitnessId: ""
    # -- WebVH / DID web server base URL. Sets pod env WEBVH_SERVER_URL.
    # Hostname is used for issuer did:web IDs from issuers.yaml aliases.
    webvhServerUrl: ""
    # -- OpenAPI / brand title. Sets PROJECT_TITLE.
    projectTitle: "UNTP Publisher"
    # -- App version string. Sets PROJECT_VERSION.
    projectVersion: "v0"
    # -- When true, include digestMultibase on OCA renderMethod (OCA_DIGEST).
    # Keep false unless oca.json for each type/version is immutable.
    ocaDigest: false

  image:
    # -- Backend image repository
    repository: ghcr.io/bcgov/untp-publisher-service
    # -- Backend image tag
    tag: v0.0.2
    # -- Backend image pull policy
    pullPolicy: IfNotPresent
    # -- Backend image pull secrets
    pullSecrets: []

  # -- Number of backend replicas
  replicaCount: 1

  # -- Annotations for backend pods
  podAnnotations: {}
  # -- Security context for backend pods
  podSecurityContext: {}
  # -- Security context for backend containers
  containerSecurityContext: {}

  service:
    # -- Backend service type
    type: ClusterIP
    # -- Backend API container port
    apiPort: 8000
    # -- Backend service port
    servicePort: 8000

  resources:
    limits:
      # -- CPU limit for backend
      cpu: 100m
      # -- Memory limit for backend
      memory: 512Mi
    requests:
      # -- CPU request for backend
      cpu: 10m
      # -- Memory request for backend
      memory: 128Mi

  networkPolicy:
    ingress:
      # -- Pod selector labels for the backend ingress network policy
      podSelector: {}

# @section MongoDB Subchart Configuration
#
# Overrides for CloudPirates MongoDB chart
# ref: https://github.com/CloudPirates-io/helm-charts/tree/main/charts/mongodb

# -- @default -- See sub-values
mongodb:
  # -- Enable bundled MongoDB subchart
  enabled: true

  image:
    # -- MongoDB image registry
    registry: docker.io
    # -- MongoDB image repository
    repository: mongo
    # -- MongoDB image tag
    tag: "8.0"
    # -- MongoDB image pull policy
    pullPolicy: IfNotPresent

  # -- Target platform for MongoDB deployment. Set to "openshift" for OpenShift compatibility.
  targetPlatform: ""

  auth:
    # -- Enable MongoDB authentication
    enabled: true
    # -- MongoDB root username
    rootUsername: "admin"

  # Custom user configuration.
  # CloudPirates MongoDB creates the user via init script using the secret keys below.
  customUser:
    # -- Name of the custom MongoDB user
    name: "untp-publisher-service"
    # -- Name of the MongoDB database
    database: "untp-publisher-service"
    # -- Name of an existing secret for custom-user credentials.
    # Default uses the parent chart-managed secret (lookup on upgrade; subchart does not
    # generate credentials). Override when using your own Secret or a non-default release name
    # (use "{release}-mongodb-custom-user-secret").
    existingSecret: "untp-publisher-service-mongodb-custom-user-secret"
    # -- Secret key names in the custom-user secret. Defaults match the CloudPirates subchart's generated secret keys.
    secretKeys:
      name: "CUSTOM_USER"
      password: "CUSTOM_PASSWORD"
      database: "CUSTOM_DB"

  # -- Labels added to all MongoDB resources
  # @default -- `{ app.kubernetes.io/role: database }`
  commonLabels:
    app.kubernetes.io/role: database

  networkPolicy:
    # -- Enable NetworkPolicy for MongoDB pods
    enabled: true
    # -- Additional ingress rules appended to the default backend→db and inter-pod rules
    extraIngress: []
    # -- Egress rules. When non-empty, policyType: Egress is added and only the listed
    # rules are allowed. Leave empty to keep egress unrestricted (Kubernetes default).
    extraEgress: []

  replicaSet:
    # -- Enable MongoDB replica set mode (standalone if false)
    enabled: false
  service:
    # -- MongoDB service type
    type: ClusterIP
    # -- MongoDB service port
    port: 27017
  # -- Set MongoDB container security context
  # @default -- `{}`
  containerSecurityContext: {}
  # -- Set MongoDB pod security context
  # @default -- `{}`
  podSecurityContext: {}
  persistence:
    # -- Enable MongoDB data persistence using PVC
    enabled: true
    # -- PVC Storage Class for MongoDB data volume
    storageClass: ""
    # -- PVC Storage size for MongoDB data volume
    size: 8Gi
