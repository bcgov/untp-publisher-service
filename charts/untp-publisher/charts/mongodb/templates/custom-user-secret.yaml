{{- if and .Values.customUser .Values.customUser.name (not .Values.customUser.existingSecret) }}
{{- $secretName := printf "%s-custom-user-secret" (include "mongodb.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $db := .Values.customUser.database | default .Values.customUser.name | b64enc }}
{{- $user := .Values.customUser.name | b64enc }}
{{- $password := "" }}
{{- if and $existing $existing.data (index $existing.data "CUSTOM_PASSWORD") }}
{{- $password = index $existing.data "CUSTOM_PASSWORD" }}
{{- else if .Values.customUser.password }}
{{- $password = .Values.customUser.password | b64enc }}
{{- else }}
{{- $password = randAlphaNum 32 | b64enc }}
{{- end }}
{{- $customDb := $db }}
{{- if and $existing $existing.data (index $existing.data "CUSTOM_DB") }}
{{- $customDb = index $existing.data "CUSTOM_DB" }}
{{- end }}
{{- $customUser := $user }}
{{- if and $existing $existing.data (index $existing.data "CUSTOM_USER") }}
{{- $customUser = index $existing.data "CUSTOM_USER" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mongodb.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    {{- with (include "mongodb.annotations" .) }}
    {{- . | nindent 4 }}
    {{- end }}
type: Opaque
data:
  CUSTOM_DB: {{ $customDb | quote }}
  CUSTOM_USER: {{ $customUser | quote }}
  CUSTOM_PASSWORD: {{ $password | quote }}
{{- end }}
