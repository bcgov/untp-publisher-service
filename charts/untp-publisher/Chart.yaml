apiVersion: v2
name: untp-publisher
description: Helm chart for the UNTP Publisher — credential registration API, Traction integration, and optional bundled MongoDB.
type: application
version: 0.1.0
appVersion: "0.0.5"

dependencies:
  # Vendored from CloudPirates mongodb 0.10.3 with stable custom-user credentials (lookup on upgrade).
  - name: mongodb
    version: 0.10.3
    repository: "file://charts/mongodb"
    condition: mongodb.enabled
  - name: common
    repository: https://charts.bitnami.com/bitnami
    tags:
      - bitnami-common
    version: 2.x.x
