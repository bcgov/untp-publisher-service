apiVersion: v2
name: untp-publisher
description: Helm chart for the UNTP Publisher — credential registration API, Traction integration, and optional bundled MongoDB.
type: application
version: 0.1.1
appVersion: "0.0.5"

dependencies:
  - name: mongodb
    version: 0.10.3
    repository: "oci://registry-1.docker.io/cloudpirates"
    condition: mongodb.enabled
  - name: common
    repository: https://charts.bitnami.com/bitnami
    tags:
      - bitnami-common
    version: 2.x.x
